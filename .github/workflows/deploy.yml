name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    # A deployment follows a passing CI run on main, or is started by hand.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build 2>&1 | tee -a run.log
        env:
          # Public values are compiled into the browser code, so they must exist at build time.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy
        run: |
          set -o pipefail
          npx opennextjs-cloudflare deploy 2>&1 | tee -a run.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The run page shows only that a step failed. Putting the end of the log in the summary
      # makes the reason readable without opening the step.
      - name: Show the end of the log
        if: failure()
        run: |
          {
            echo '### End of the log'
            echo '```'
            if [ -s run.log ]; then
              sed 's/\x1b\[[0-9;]*m//g' run.log | tail -n 60
            else
              echo 'The build and deploy steps wrote nothing, so an earlier step failed.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
